<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>RepoWays 悬停菜单回归台</title>
    <style>
      /* GitHub's own Primer tokens, values measured off github.com on 2026-10-14.
         The extension UI reads these through the shadow boundary, so the
         harness has to publish them the same way GitHub does — and the
         `data-color-mode` attribute is what the shipped MutationObserver watches
         for theme switches, so the harness keys its token blocks to it too. */
      :root[data-color-mode="light"] {
        --bgColor-default: #fff;
        --bgColor-muted: #f6f8fa;
        --bgColor-neutral-muted: #818b981f;
        --fgColor-default: #1f2328;
        --fgColor-muted: #59636e;
        --button-default-fgColor-rest: #25292e;
        --borderColor-default: #d1d9e0;
        --borderColor-muted: #d1d9e0b3;
        --overlay-bgColor: #fff;
        --borderRadius-large: 0.75rem;
        --borderRadius-medium: 0.375rem;
        --control-transparent-bgColor-hover: #818b981a;
        --shadow-floating-small:
          0 0 0 1px #d1d9e040, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f;
        --shadow-floating-medium:
          0 0 0 1px #d1d9e000, 0 8px 16px -4px #25292e14, 0 4px 32px -4px #25292e14;
      }
      :root[data-color-mode="dark"] {
        --bgColor-default: #0d1117;
        --bgColor-muted: #151b23;
        --bgColor-neutral-muted: #656c7633;
        --fgColor-default: #f0f6fc;
        --fgColor-muted: #9198a1;
        --button-default-fgColor-rest: #f0f6fc;
        --borderColor-default: #3d444d;
        --borderColor-muted: #3d444db3;
        --overlay-bgColor: #010409;
        --borderRadius-large: 0.75rem;
        --borderRadius-medium: 0.375rem;
        --control-transparent-bgColor-hover: #656c7633;
        --shadow-floating-small:
          0 0 0 1px #3d444d, 0 6px 12px -3px #01040966, 0 6px 18px 0 #01040966;
        --shadow-floating-medium:
          0 0 0 1px #3d444d, 0 8px 16px -4px #01040966, 0 4px 32px -4px #01040966;
      }
      body {
        background: var(--bgColor-default, #fff);
        color: var(--fgColor-default, #1f2328);
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        margin: 0;
        padding: 24px;
      }
      .row {
        align-items: center;
        display: flex;
        /* On a real repo page the Code button sits at the right end of the
           header row, which is what makes the menu's right edge line up with
           it instead of clamping to the viewport. */
        gap: 8px;
        justify-content: flex-end;
      }
      /* Stand in for GitHub's Code button; the content script copies its height. */
      .gh-btn {
        align-items: center;
        background: var(--bgColor-muted, #f6f8fa);
        border: 1px solid var(--borderColor-default, rgba(31, 35, 40, 0.15));
        border-radius: 6px;
        color: var(--fgColor-default, #1f2328);
        display: inline-flex;
        font-size: 12px;
        gap: 4px;
        height: 28px;
        justify-content: center;
        padding: 0 12px;
        white-space: nowrap;
      }
      /* Stand in for the branch switcher — the style donor. Values measured off
         github.com 2026-10-14 (muted #f6f8fa fill, 0.8px #d1d9e0 border, 6px
         radius, `0 12px` padding, 14px/500/21px text, 8px gap, 1px drop shadow
         that is *not* inset); token-driven so flipping the theme actually
         changes what the extension is supposed to copy. The label colour is
         `--button-default-fgColor-rest` (#25292e), not `--fgColor-default`
         (#1f2328) — that was the mock's own drift (re-measured 2026-10-15, the
         real branch switcher and "Go to file" both paint rgb(37, 41, 46)) — and
         `font-family: inherit` mirrors what github.com does explicitly on its
         buttons: it repeats the `<body>` stack instead of taking a button's UA
         default. */
      .gh-ref {
        align-items: center;
        background: var(--bgColor-muted, #f6f8fa);
        border: 0.8px solid var(--borderColor-default, #d1d9e0);
        border-radius: var(--borderRadius-medium, 6px);
        box-shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
        box-sizing: border-box;
        color: var(--button-default-fgColor-rest, #25292e);
        display: flex;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        gap: var(--control-medium-gap, 8px);
        height: 32px;
        justify-content: space-between;
        line-height: 21px;
        padding: 0 12px;
        white-space: nowrap;
      }
      .report {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.7;
        margin-top: 24px;
        white-space: pre-wrap;
      }
      .report .fail {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h2>octocat/hello-world</h2>
    <div id="anchor">
      <!-- The repo header row, without the `#repo-content-turbo-frame` it used to
           sit in. GitHub has begun dropping that frame (2026-10-16) and this
           fixture kept the wrapper long after the site had stopped shipping it on
           some repo pages — which is why the suite stayed green while the shipped
           selector went blind. A fixture is only evidence about the page it
           copies. -->
      <div class="row">
        <button class="gh-ref" id="ref-picker-repos-header-ref-selector" data-component="Button"
          data-variant="default" data-size="medium" aria-haspopup="true">
          main
        </button>
        <button class="gh-btn" data-component="Button" data-variant="primary" data-size="medium" aria-haspopup="true">
          Code
        </button>
      </div>
    </div>
    <div class="report" id="report">running…</div>

    <script>
      // The real built bundle is loaded from `.output`, so this page exercises
      // shipped code rather than a copy. Paths are captured before
      // replaceState() moves the document URL to a repo-shaped one.
      const OUT = new URL("../.output/chrome-mv3/", location.href).href;

      const messages = (() => {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", `${OUT}_locales/zh_CN/messages.json`, false);
        xhr.send();
        return JSON.parse(xhr.responseText);
      })();

      window.chrome = {
        runtime: { id: "repoways-harness" },
        i18n: { getMessage: (name) => messages[name]?.message ?? "" },
      };

      history.replaceState(null, "", "/octocat/hello-world");

      const script = document.createElement("script");
      script.src = `${OUT}content-scripts/content.js`;
      document.body.append(script);
    </script>
    <script>
      addEventListener("load", () => {
        const lines = [];
        const check = (label, ok, detail = "") =>
          lines.push(`${ok ? "PASS" : "FAIL"}  ${label}${detail ? ` — ${detail}` : ""}`);

        let rendered = false;
        const render = () => {
          if (rendered) return;
          rendered = true;
          document.getElementById("report").innerHTML = lines
            .map((l) => `<div class="${l.startsWith("FAIL") ? "fail" : ""}">${l}</div>`)
            .join("");
          window.__done = true;
          window.__fail = lines.filter((l) => l.startsWith("FAIL")).length;
        };
        // Without this a throw in the async tail leaves the report on
        // "running…" forever, which reads as a slow page instead of a broken one.
        addEventListener("unhandledrejection", (event) => {
          lines.push(`FAIL  检查抛错 — ${event.reason}`);
          render();
        });
        addEventListener("error", (event) => {
          lines.push(`FAIL  检查抛错 — ${event.message}`);
          render();
        });

        const hosts = document.querySelectorAll("repoways-ui");
        check("注入一个 host", hosts.length === 1, `count=${hosts.length}`);

        const host = hosts[0];
        const root = host?.shadowRoot;
        const codeButton = document.querySelector(
          'button[data-component="Button"][data-variant="primary"][aria-haspopup="true"]',
        );

        check("host 在 Code 按钮左边", host?.nextElementSibling === codeButton);

        const button = root?.querySelector(".rw-btn");
        const menu = root?.querySelector(".rw-menu");
        const items = [...(root?.querySelectorAll(".rw-item") ?? [])];

        check("按钮文字是 Ways", button?.textContent.trim() === "Ways", `text="${button?.textContent.trim()}"`);

        // Icon / label / caret. The leading glyph is ours (Octicons has no route
        // icon) and it is now the product's own logo, so it is pinned by its real
        // geometry rather than a prefix: the fan-out's three spokes and four
        // *hollow* rings, the blue plate gone, and currentColor as the ink. The
        // caret is the one copied out of the branch button's markup.
        const glyphs = [...(button?.querySelectorAll("svg") ?? [])];
        const leadGlyph = glyphs[0];
        const leadGroups = [...(leadGlyph?.querySelectorAll("g") ?? [])];
        const leadSpokes = [...(leadGlyph?.querySelectorAll("path") ?? [])].map((p) => p.getAttribute("d"));
        const leadRings = [...(leadGlyph?.querySelectorAll("circle") ?? [])].map(
          (c) => `${c.getAttribute("cx")},${c.getAttribute("cy")}/${c.getAttribute("r")}`,
        );
        // A ring only reads as hollow if nothing paints its inside, so the two
        // ways to break it are checked here: a second group (the old filled
        // twin), or a circle carrying a fill of its own.
        const ringFills = [...(leadGlyph?.querySelectorAll("circle") ?? [])].map((c) => c.getAttribute("fill"));
        const leadStrokeWidth = leadGroups[0]?.getAttribute("stroke-width") ?? "";
        const caretGlyph = glyphs[1]?.querySelector("path")?.getAttribute("d") ?? "";
        check(
          "按钮是 项目 logo（无底板、细线走 currentColor、四个空心圆）+ Ways + 箭头",
          glyphs.length === 2 &&
            button.firstElementChild === glyphs[0] &&
            button.lastElementChild === glyphs[1] &&
            (leadGlyph?.getAttribute("viewBox") ?? "") === "168 162 700 700" &&
            leadGlyph?.querySelector("rect") === null &&
            leadGroups.length === 1 &&
            leadGroups[0].getAttribute("stroke") === "currentColor" &&
            leadGroups[0].getAttribute("fill") === "none" &&
            leadStrokeWidth === "64" &&
            leadSpokes.join("|") === "M319.8 480.7L644.2 299.3|M328 512L708 512|M319.8 543.3L644.2 724.7" &&
            leadRings.join("|") === "264,512/64|700,268/64|772,512/64|700,756/64" &&
            ringFills.every((f) => f === null) &&
            caretGlyph.startsWith("m4.427 7.427"),
          `${glyphs.length} 个图标, viewBox=${leadGlyph?.getAttribute("viewBox")}, 组 ${leadGroups.length}, 线宽 ${leadStrokeWidth}, 描边 ${leadSpokes.length} 条, 环 ${leadRings.join(" ")}`,
        );
        check("菜单初始隐藏", menu?.hidden === true);
        check("十二条入口", items.length === 12, `count=${items.length}`);

        const expected = [
          "https://gitdiagram.com/octocat/hello-world",
          "https://github.com/octocat/hello-world/network/dependencies",
          "https://deepwiki.com/octocat/hello-world",
          "https://zread.ai/octocat/hello-world",
          "https://gitreverse.com/octocat/hello-world",
          "https://gitmcp.io/octocat/hello-world",
          "https://gitingest.com/octocat/hello-world",
          "https://github1s.com/octocat/hello-world",
          "https://github.dev/octocat/hello-world",
          "https://codespaces.new/octocat/hello-world",
          "https://stackblitz.com/github/octocat/hello-world",
          "https://ossinsight.io/analyze/octocat/hello-world",
        ];
        const wrong = items
          .map((el, i) => (el.href === expected[i] ? null : `${i}: ${el.href}`))
          .filter(Boolean);
        check("十二条链接逐条对位", wrong.length === 0, wrong.join(" | "));

        // Panel shape is GitHub's own popover: 12px corner, 8px of inset around
        // the rows, and **no border** — the hairline is the first layer of
        // `--shadow-floating-small`.
        const ms = getComputedStyle(menu);
        const ring = "rgba(209, 217, 224, 0.25) 0px 0px 0px 1px";
        check(
          "浮层是 GitHub 弹层的样子",
          ms.borderTopWidth === "0px" &&
            ms.borderRadius === "12px" &&
            ms.padding === "8px" &&
            ms.backgroundColor === "rgb(255, 255, 255)" &&
            ms.boxShadow.startsWith(ring),
          `border=${ms.borderTopWidth} radius=${ms.borderRadius} pad=${ms.padding} bg=${ms.backgroundColor} shadow=${ms.boxShadow.slice(0, ring.length)}`,
        );

        // The open animation, measured off GitHub's own dropdown 2026-10-16: its
        // React overlay runs `prc-Overlay-overlay-appear` — opacity 0 → 1 over
        // 0.2s with Primer's `cubic-bezier(0.33, 1, 0.68, 1)` — and its
        // keyframes carry no transform, so the panel fades where it sits instead
        // of scaling or sliding (a recording of the real dropdown shows the same).
        // The numbers are pinned here rather than compared against a mock: the
        // requirement is "like GitHub", so GitHub's measured values are the
        // oracle. Primer gates these rules behind
        // `prefers-reduced-motion: no-preference`, and the shipped stylesheet
        // repeats that guard, so the check only applies when this browser agrees
        // — otherwise a reduced-motion environment would fail the suite for
        // correctly honouring the preference.
        const motionOk = matchMedia("(prefers-reduced-motion: no-preference)").matches;
        const sheetRules = [...(root?.styleSheets?.[0]?.cssRules ?? [])];
        const appearRule = sheetRules.find((r) => r.name === "rw-menu-appear");
        const appearSteps = appearRule
          ? [...appearRule.cssRules].map((k) => `${k.keyText}:${k.style.opacity}`)
          : [];
        check(
          "展开动画抄自 GitHub 弹层（0.2s 淡入、无缩放位移）",
          !motionOk ||
            (ms.animationName === "rw-menu-appear" &&
              ms.animationDuration === "0.2s" &&
              ms.animationTimingFunction === "cubic-bezier(0.33, 1, 0.68, 1)" &&
              appearSteps.join("|") === "0%:0|100%:1"),
          `reduced=${!motionOk} name=${ms.animationName} ${ms.animationDuration} ${ms.animationTimingFunction} steps=${appearSteps.join("|")}`,
        );

        // Row anatomy, GitHub's own: the destination's mark and its name are one
        // group on the left, the description is the secondary text on the right.
        const first = items[0];
        const lead = first?.firstElementChild;
        const icon = lead?.firstElementChild;
        const name = lead?.lastElementChild;
        const desc = first?.lastElementChild;
        check(
          "每行是「图标 + 服务名」在左、描述在右",
          lead?.className === "rw-lead" &&
            lead?.children.length === 2 &&
            icon?.tagName === "svg" &&
            icon?.getAttribute("class") === "rw-icon" &&
            name?.className === "rw-name" &&
            name?.textContent === "GitDiagram" &&
            desc?.className === "rw-desc" &&
            desc?.textContent === "生成架构图" &&
            getComputedStyle(desc).color === "rgb(89, 99, 110)",
          `${lead?.className}>${icon?.tagName}.${icon?.getAttribute("class")}+${name?.className}="${name?.textContent}" / ${desc?.className}="${desc?.textContent}"`,
        );

        // Every row carries its own mark, sized as GitHub sizes the ones in its
        // dropdown. `innerHTML.length` is the identity proxy: a set of rows that
        // all pointed at one icon would collapse the set to 1.
        const icons = items.map((el) => el.querySelector(".rw-lead > svg.rw-icon"));
        const sizes = new Set(icons.map((el) => el?.innerHTML.length));
        const is = icons[0] ? getComputedStyle(icons[0]) : {};
        check(
          "十二行各有自己的品牌图标",
          icons.every(Boolean) &&
            icons.every((el) => el.firstElementChild !== null && el.getAttribute("viewBox")) &&
            sizes.size === 12 &&
            is.width === "16px" &&
            is.height === "16px" &&
            is.flexGrow === "0",
          `missing=${icons.filter((el) => !el).length} distinct=${sizes.size} size=${is.width}×${is.height}`,
        );

        // github.com's CSP is `img-src 'self' data: blob: github.githubassets.com`,
        // so a chrome-extension:// image href silently never paints: every raster
        // mark has to arrive as an inline data: URI. Six rows are raster
        // (GitDiagram / DeepWiki / Zread / GitMCP / GitHub.dev / OSSInsight),
        // and this pins the rule for whatever gets added next.
        const rasters = [...(root?.querySelectorAll(".rw-lead > svg.rw-icon > image") ?? [])];
        const inlineOk = (el) => (el.getAttribute("href") ?? "").startsWith("data:image/png;base64,");
        check(
          "位图图标一律是 data: 内联",
          rasters.length > 0 && rasters.every(inlineOk),
          `${rasters.length} 张位图, 非 data: ${rasters.filter((el) => !inlineOk(el)).length}`,
        );

        check(
          "GitHub1s 那行带的是双档品牌填充",
          items[7]?.querySelector("path")?.getAttribute("fill") === "light-dark(#13227a,#0a84ff)",
          `${items[7]?.querySelector("path")?.getAttribute("fill")}`,
        );

        // The right-hand arrow the previous version put at the end of every
        // description is gone, not merely hidden. Real `:hover` cannot be
        // synthesized here, so the stylesheet is read rather than exercised.
        const rules = [...(root?.styleSheets?.[0]?.cssRules ?? [])];
        check(
          "行尾不再有箭头",
          root?.querySelector(".rw-arrow") === null &&
            !rules.some((r) => (r.selectorText ?? "").includes("rw-arrow")),
          `${root?.querySelectorAll(".rw-arrow").length} 个节点 / ${rules.filter((r) => (r.selectorText ?? "").includes("rw-arrow")).length} 条规则`,
        );

        // ActionList row: 6px corner, 6px/8px inset, 14px text, and no divider
        // between rows (GitHub separates groups, not items).
        const rs = getComputedStyle(items[1]);
        check(
          "行是 ActionList 的样子",
          rs.borderRadius === "6px" &&
            rs.padding === "6px 8px" &&
            rs.fontSize === "14px" &&
            rs.borderTopWidth === "0px",
          `radius=${rs.borderRadius} pad=${rs.padding} fs=${rs.fontSize} top=${rs.borderTopWidth}`,
        );

        // The one exception: a hairline between groups. GitHub's popover draws it
        // with an element of its own (Primer's `ActionList.Divider`) rather than
        // with a border on the next row — that is the only way it can span the
        // panel's full width while the rows stay inset 8px. Twelve rows in four
        // contiguous groups (structure 0-1, ai 2-6, code 7-10, analytics 11)
        // means exactly three, each sitting after the last row of its group, and
        // the menu's first row is never preceded by one. Both the row that used
        // to carry the border and the one that follows a divider must read 0px,
        // so a return to the old shape fails here rather than looking fine.
        const dividers = [...(root?.querySelectorAll(".rw-divider") ?? [])];
        const seam = dividers[0];
        const ds = seam ? getComputedStyle(seam) : {};
        const seamIdx = dividers.map((el) => items.indexOf(el.previousElementSibling));
        check(
          "组间有 GitHub 式分隔线（3 条、接在每段末尾、首行前面没有）",
          dividers.length === 3 &&
            seamIdx.join(",") === "1,6,10" &&
            dividers.every((el) => el.getAttribute("aria-hidden") === "true") &&
            seam.nextElementSibling === items[2] &&
            ds.height === "1px" &&
            ds.backgroundColor === "rgb(209, 217, 224)" &&
            ds.marginTop === "7px" &&
            ds.marginBottom === "8px" &&
            getComputedStyle(items[2]).borderTopWidth === "0px",
          `n=${dividers.length} after=[${seamIdx.join(",")}] h=${ds.height} bg=${ds.backgroundColor} m=${ds.marginTop}/${ds.marginBottom} 行borderTop=${getComputedStyle(items[2]).borderTopWidth}`,
        );

        // The donor supplies every visual property; the Code button only owns
        // the height, so that one has to match the button and the rest have to
        // match the branch switcher, property by property.
        const MIRROR = [
          "backgroundColor",
          "boxShadow",
          "color",
          "borderWidth",
          "borderStyle",
          "borderColor",
          "borderRadius",
          "padding",
          "gap",
          "fontFamily",
          "fontSize",
          "fontWeight",
          "lineHeight",
        ];
        const donor = document.querySelector(
          "#ref-picker-repos-header-ref-selector",
        );
        // The fallback check below takes the donor away; remember where it sat
        // so the page ends as it started and the tail can be re-run by hand.
        const donorSlot = { row: donor.parentElement };
        const css = getComputedStyle(codeButton);
        const own = getComputedStyle(button);
        const dp = getComputedStyle(donor);
        const mism = (a, b) => MIRROR.filter((p) => a[p] !== b[p]).map((p) => `${p}: ${a[p]} ≠ ${b[p]}`);

        check("高度跟随 Code 按钮", own.height === css.height, `${own.height} vs ${css.height}`);
        check("样式与分支按钮逐属性相同（浅色）", mism(own, dp).length === 0, mism(own, dp).join(" | "));

        // The check above only proves the copy equals the donor, and it passes
        // just as happily against a donor that has itself drifted from
        // github.com — which is what had happened: the fixture painted the mock
        // branch button with `--fgColor-default` (#1f2328) while the real one
        // paints `--button-default-fgColor-rest` (#25292e), so a green harness
        // said nothing about the label matching GitHub's buttons. The visible
        // text is the label span, not the button box, so read it there and pin
        // it to the numbers measured off github.com 2026-10-15: every button in
        // that row (branch switcher, "Go to file", "Code") reads 14px / 500 /
        // 21px in the button's own foreground.
        const buttonLabel = root?.querySelector(".rw-btn > span");
        const lf = getComputedStyle(buttonLabel);
        check(
          "按钮文字与 github.com 按钮一致（14px/500/21px、按钮前景色）",
          lf.fontSize === "14px" &&
            lf.fontWeight === "500" &&
            lf.lineHeight === "21px" &&
            lf.color === "rgb(37, 41, 46)" &&
            lf.fontFamily === dp.fontFamily,
          `${lf.fontSize}/${lf.fontWeight}/${lf.lineHeight} color=${lf.color} family=${lf.fontFamily}`,
        );

        // Click, not hover. `pointerenter` does not bubble, so a real pointer
        // entering the button fires it on the wrapper as its own dispatch — both
        // elements get a synthetic one, because proving the negative needs the
        // event to arrive wherever a listener could still be hiding.
        const wrap = root?.querySelector(".rw");
        wrap?.dispatchEvent(new PointerEvent("pointerenter", { bubbles: false }));
        button?.dispatchEvent(new PointerEvent("pointerenter", { bubbles: false }));
        check("悬停不展开", menu?.hidden === true);

        button?.click();
        check("点击展开", menu?.hidden === false);
        // The declaration above proves the stylesheet says so; this proves it
        // actually replays. `hidden` toggles `display`, and an element coming
        // back from `display: none` starts its animation again from the top —
        // which is why no JS is needed to re-trigger it on every open, and why
        // this has to be read synchronously, while the 200ms is still running.
        const replay = menu?.getAnimations?.() ?? [];
        check(
          "每次展开都从头重放这支动画",
          !motionOk || replay.some((a) => a.animationName === "rw-menu-appear"),
          `${replay.length} 条: ${replay.map((a) => a.animationName).join(",") || "无"}`,
        );

        // Only measurable once displayed: a `hidden` element reports a 0×0 rect.
        // The width is *not* pinned to a number: `width: max-content` makes it a
        // text-measurement (twelve rows, icons in: zh_CN 238.93px here, en
        // 285.34px), and text measurement follows the machine's fonts, so a
        // literal would flake. What is stable, and what the rule means, is that
        // the panel is exactly its longest row plus the 8px inset on each side —
        // and that it sits between the 220px floor and the 320px cap rather than
        // the old fixed 400. en is the wider of the two (see the note in
        // menu.css), and this page only ships zh_CN, so measuring en is a manual
        // step: rewrite each `.rw-desc` from `_locales/en/messages.json` and
        // re-read the rect.
        const mw = menu.getBoundingClientRect().width;
        const widest = Math.max(...items.map((el) => el.getBoundingClientRect().width));
        check(
          "展开后弹层贴着最长行、落在 220–320 之间、行 32px、图标 16px",
          mw >= 220 &&
            mw <= 320 &&
            Math.abs(mw - (widest + 16)) < 0.5 &&
            items[1].getBoundingClientRect().height === 32 &&
            icon.getBoundingClientRect().width === 16 &&
            icon.getBoundingClientRect().height === 16,
          `menu=${mw} widest=${widest} row=${items[1].getBoundingClientRect().height} icon=${icon.getBoundingClientRect().width}×${icon.getBoundingClientRect().height}`,
        );

        // The seam reaches both edges of the panel — that is the whole reason it
        // is an element rather than a border on an inset row. Rects are only
        // meaningful now that the menu is displayed: a `hidden` element reports
        // 0×0 (the same trap the width check above documents).
        const seamRect = seam.getBoundingClientRect();
        const panelRect = menu.getBoundingClientRect();
        const rowRect = items[1].getBoundingClientRect();
        check(
          "分隔线通到弹层两侧边缘（比行宽出两侧各 8px）",
          Math.abs(seamRect.left - panelRect.left) < 0.5 &&
            Math.abs(seamRect.right - panelRect.right) < 0.5 &&
            Math.abs(seamRect.width - (widest + 16)) < 0.5 &&
            Math.abs(seamRect.left - (rowRect.left - 8)) < 0.5,
          `seam=[${seamRect.left.toFixed(1)}, ${seamRect.right.toFixed(1)}] w=${seamRect.width.toFixed(1)} 菜单=[${panelRect.left.toFixed(1)}, ${panelRect.right.toFixed(1)}] 行left=${rowRect.left.toFixed(1)}`,
        );

        const rect = button.getBoundingClientRect();
        const mr = menu.getBoundingClientRect();
        check(
          "浮层右对齐按钮、落在按钮下方",
          (Math.abs(mr.right - rect.right) < 1 || mr.left === 8) && mr.top >= rect.bottom,
          `menu=[${mr.left.toFixed(1)}, ${mr.right.toFixed(1)}, top ${mr.top.toFixed(1)}] button.right=${rect.right.toFixed(1)} button.bottom=${rect.bottom.toFixed(1)}`,
        );
        check(
          "浮层不出视口",
          mr.left >= 8 && mr.right <= innerWidth - 8,
          `viewport=${innerWidth} menu=${mr.left.toFixed(1)}…${mr.right.toFixed(1)}`,
        );

        // The rows are `position: fixed` but still DOM descendants of the
        // wrapper, so this hit test is the proof that the list is actually where
        // its anchor says it is and reachable by a pointer travelling down.
        const row = items[3].getBoundingClientRect();
        const hitRow = root.elementFromPoint(row.left + 40, row.top + row.height / 2);
        check(
          "菜单行点得中",
          hitRow === items[3] || items[3].contains(hitRow),
          `hit=${hitRow?.className || hitRow?.tagName}`,
        );

        // Nothing dismisses on pointer movement any more — the list only goes
        // away on a press somewhere else, a row pick, or Escape.
        items[3].dispatchEvent(new PointerEvent("pointerenter", { bubbles: false }));
        wrap.dispatchEvent(new PointerEvent("pointerleave", { bubbles: false }));
        check("指针进出菜单都不收起", menu?.hidden === false);

        button.click();
        check("再点一次收起", menu?.hidden === true);

        button.click();
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        check("Esc 收起", menu?.hidden === true);

        button.click();
        document.body.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
        check("点页面别处收起", menu?.hidden === true);

        // An untrusted click on an `<a>` still follows the link, so the guard
        // below eats the navigation and leaves the event for our own listener:
        // picking an entry closes the list, exactly like GitHub's dropdown.
        button.click();
        items[3].addEventListener("click", (event) => event.preventDefault(), { capture: true, once: true });
        items[3].click();
        check("点条目收起", menu?.hidden === true);

        setTimeout(async () => {
          document.dispatchEvent(new Event("turbo:load"));
          check(
            "turbo:load 后不重复注入",
            document.querySelectorAll("repoways-ui").length === 1 &&
              document.querySelector("repoways-ui")?.shadowRoot.querySelector(".rw-item")?.href ===
                "https://gitdiagram.com/octocat/hello-world",
          );

          // Dismissal lives on `window`, outside the host that `ensure()` throws
          // away on every re-render, so it is the one thing a re-mount has to
          // re-arm by hand: check the fresh instance opens *and* closes, not just
          // the first one.
          const again = document.querySelector("repoways-ui").shadowRoot;
          again.querySelector(".rw-btn").click();
          check("重新挂载后仍是点击才展开", again.querySelector(".rw-menu").hidden === false);
          document.body.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
          check("重新挂载后点别处照样收起", again.querySelector(".rw-menu").hidden === true);

          // Theme is a couple of attributes on <html>, flipped with no
          // navigation and no `turbo:load`, so the copied values are only as
          // fresh as the shipped MutationObserver keeps them. Its callback is a
          // microtask, so any yield proves it has already run.
          const fresh = document.querySelector("repoways-ui").shadowRoot;
          const fBtn = fresh.querySelector(".rw-btn");
          const fMenu = fresh.querySelector(".rw-menu");
          document.documentElement.dataset.colorMode = "dark";
          await new Promise((resolve) => setTimeout(resolve, 0));

          const dark = getComputedStyle(fBtn);
          check(
            "样式与分支按钮逐属性相同（深色）",
            mism(dark, getComputedStyle(donor)).length === 0,
            mism(dark, getComputedStyle(donor)).join(" | "),
          );
          const darkMenu = getComputedStyle(fMenu);
          check(
            "深色下真换了色、弹层也跟着变量",
            dark.backgroundColor === "rgb(21, 27, 35)" &&
              dark.color === "rgb(240, 246, 252)" &&
              darkMenu.backgroundColor === "rgb(1, 4, 9)" &&
              darkMenu.boxShadow.startsWith("rgb(61, 68, 77) 0px 0px 0px 1px"),
            `按钮=${dark.backgroundColor} / ${dark.color} / 弹层=${darkMenu.backgroundColor} / ${darkMenu.boxShadow.slice(0, 28)}`,
          );

          // The group seam is `var(--borderColor-default)`, so it has to flip with
          // the page too — the light check pinned rgb(209,217,224); here the same
          // hairline must read the dark token, not stay a light grey.
          const darkSeam = getComputedStyle(fresh.querySelector(".rw-divider"));
          check(
            "深色下分隔线也跟着 --borderColor-default",
            darkSeam.height === "1px" && darkSeam.backgroundColor === "rgb(61, 68, 77)",
            `h=${darkSeam.height} bg=${darkSeam.backgroundColor}`,
          );

          // Drop the donor (some repo layouts and narrow viewports render the row
          // without it) and the tokens (they could be renamed again) and the
          // stylesheet's own literals still paint a branch-button-shaped control.
          donor.remove();
          delete document.documentElement.dataset.colorMode;
          document.dispatchEvent(new Event("turbo:load"));
          const bareRoot = document.querySelector("repoways-ui").shadowRoot;
          const bare = getComputedStyle(bareRoot.querySelector(".rw-btn"));
          const bareMenu = getComputedStyle(bareRoot.querySelector(".rw-menu"));
          // Chrome snaps border widths to whole device pixels before it
          // serializes them, so a declared `0.8px` reads back as `0.8px` at DPR
          // 1.25 (one device pixel) but as `1px` at DPR 1 — the same declaration
          // on the same file measured both ways in one session. Pinning either
          // string is machine-dependent, so compare against a probe carrying the
          // identical shorthand; a fallback that lost its border reads `0px` and
          // still fails.
          const probe = document.createElement("div");
          probe.style.cssText = "position:absolute;border:0.8px solid red";
          document.body.append(probe);
          const declared = getComputedStyle(probe).borderTopWidth;
          probe.remove();
          check(
            "donor 与变量都没有时回落字面色值",
            bare.backgroundColor === "rgb(246, 248, 250)" &&
              bare.color === "rgb(37, 41, 46)" &&
              declared !== "0px" &&
              bare.borderTopWidth === declared &&
              bare.borderRadius === "6px" &&
              bare.fontSize === "14px" &&
              bare.fontWeight === "500" &&
              bare.lineHeight === "21px" &&
              // Without `font: inherit` in the stylesheet a shadow `<button>`
              // takes the UA's own font (Arial here) instead of the page's, and
              // the label would render in a different typeface with no token
              // involved — the one part of "字体" no token can rescue.
              bare.fontFamily === getComputedStyle(document.body).fontFamily &&
              bare.gap === "8px" &&
              bare.padding === "0px 12px",
            `${bare.backgroundColor} / ${bare.color} / ${bare.borderTopWidth} (declared 0.8px reads ${declared}) / ${bare.fontWeight} / ${bare.fontFamily.slice(0, 24)} / ${bare.gap} / ${bare.padding}`,
          );
          check(
            "弹层没有变量时也自带那副样子",
            bareMenu.backgroundColor === "rgb(255, 255, 255)" &&
              bareMenu.borderRadius === "12px" &&
              bareMenu.boxShadow.startsWith("rgba(209, 217, 224, 0.25) 0px 0px 0px 1px"),
            `${bareMenu.backgroundColor} / ${bareMenu.borderRadius} / ${bareMenu.boxShadow.slice(0, 38)}`,
          );

          // The donor sits first in the row, so re-insert it before the Code
          // button rather than before whatever sibling it had when the fixture
          // was captured — that sibling is our own host, and every re-mount
          // removes it (taking the reference with it).
          donorSlot.row.insertBefore(donor, codeButton);
          document.documentElement.dataset.colorMode = "light";
          document.dispatchEvent(new Event("turbo:load"));
          const back = getComputedStyle(
            document.querySelector("repoways-ui").shadowRoot.querySelector(".rw-btn"),
          );
          check(
            "donor 回来后重新挂载又跟上它的样式",
            mism(back, getComputedStyle(donor)).length === 0,
            mism(back, getComputedStyle(donor)).join(" | "),
          );

          // --- 跟随锚点（滚动 / 缩放） ---
          // The panel is `position: fixed`, so nothing in the layout keeps it
          // hanging off its button: whatever moves the anchor has to be answered
          // by re-measuring. Real scrolling is not something this harness can ask
          // for — the in-app Browser's surface is hidden, so a `scrollTo` may not
          // move the document at all, and a frame never runs (see AGENTS.md) —
          // so the movement is produced the other way round: the anchor is
          // *shifted* by inserting a spacer in front of it, which moves the button
          // exactly as a scroll would, and then the event the shipped listener
          // listens for is dispatched on `window`. That binding is capture on
          // `window` precisely because a document-level scroll (the real one) is
          // raised on `document` and does not bubble — a capture listener on the
          // window is what hears it — and the re-place inside it is synchronous,
          // so none of this needs to wait.
          const liveRoot = document.querySelector("repoways-ui").shadowRoot;
          const liveBtn = liveRoot.querySelector(".rw-btn");
          const liveMenu = liveRoot.querySelector(".rw-menu");
          // Same 4px the panel measures off its anchor with (see content.ts).
          const GAP = 4;
          const at = () => ({
            btn: liveBtn.getBoundingClientRect(),
            menu: liveMenu.getBoundingClientRect(),
          });

          liveBtn.click();
          const opened = at();
          check(
            "展开时挂在按钮下方 4px、右缘对齐",
            Math.abs(opened.menu.top - (opened.btn.bottom + GAP)) < 1 &&
              Math.abs(opened.menu.right - opened.btn.right) < 1,
            `menu.top=${opened.menu.top.toFixed(1)} button.bottom=${opened.btn.bottom.toFixed(1)} 右缘差 ${(opened.menu.right - opened.btn.right).toFixed(2)}`,
          );

          // A 2400px spacer in front of the anchor is this page being scrolled by
          // 2400px: the button lands far below the viewport, where a twelve-row
          // list cannot fit under it and has to flip above.
          const spacer = document.createElement("div");
          spacer.style.height = "2400px";
          spacer.setAttribute("aria-hidden", "true");
          document.getElementById("anchor").before(spacer);
          const shifted = at();
          check(
            "锚点被挪走后浮层停在原处（fixed 不会自己跟）",
            Math.abs(shifted.menu.top - opened.menu.top) < 1 && shifted.btn.top - opened.btn.top > 2000,
            `菜单 top ${opened.menu.top.toFixed(1)}→${shifted.menu.top.toFixed(1)}，按钮 top ${opened.btn.top.toFixed(1)}→${shifted.btn.top.toFixed(1)}`,
          );

          window.dispatchEvent(new Event("scroll"));
          const flipped = at();
          check(
            "一条 scroll 事件让浮层重新挂回按钮（下方放不下就翻到上方）",
            Math.abs(flipped.menu.bottom - (flipped.btn.top - GAP)) < 1 &&
              flipped.menu.top < flipped.btn.top &&
              Math.abs(flipped.menu.right - flipped.btn.right) < 1,
            `button.top=${flipped.btn.top.toFixed(1)} menu=[${flipped.menu.top.toFixed(1)}, ${flipped.menu.bottom.toFixed(1)}]`,
          );

          // Taking the spacer away is the scroll back to the top, and the same
          // event has to put the panel back under the button.
          spacer.remove();
          window.dispatchEvent(new Event("scroll"));
          const restored = at();
          check(
            "回到原位后浮层又落回按钮下方",
            Math.abs(restored.menu.top - (restored.btn.bottom + GAP)) < 1 &&
              Math.abs(restored.menu.top - opened.menu.top) < 1,
            `menu.top=${restored.menu.top.toFixed(1)} button.bottom=${restored.btn.bottom.toFixed(1)}`,
          );

          // Same shape for the other listener: pushing the Code button out by
          // 300px drags the whole flex-end row left, and a `resize` has to bring
          // the panel's right edge along with it.
          codeButton.style.marginRight = "300px";
          window.dispatchEvent(new Event("resize"));
          const resized = at();
          check(
            "一条 resize 事件也让浮层跟上新位置",
            Math.abs(resized.menu.right - resized.btn.right) < 1 &&
              resized.btn.right < opened.btn.right - 200,
            `按钮右缘 ${opened.btn.right.toFixed(1)}→${resized.btn.right.toFixed(1)}，菜单右缘差 ${(resized.menu.right - resized.btn.right).toFixed(2)}`,
          );
          codeButton.style.marginRight = "";
          window.dispatchEvent(new Event("resize"));

          // Left closed, like the page was found.
          liveBtn.click();

          // The CSP rule checked earlier only pins the *shape* of the href, and
          // that is not enough: a PNG whose deflate stream is corrupt still
          // starts with `data:image/png;base64,` and still measures 16×16, while
          // painting absolutely nothing — which is exactly how a dead OSSInsight
          // mark shipped unnoticed (2026-10-15, base64 hand-retyped during an
          // unrelated edit, two characters drifted, IDAT CRC went bad). So decode
          // every distinct raster href for real and require visible pixels.
          const freshRasters = [...fresh.querySelectorAll(".rw-lead > svg.rw-icon > image")];
          const hrefs = [...new Set(freshRasters.map((el) => el.getAttribute("href")))];

          const decoded = await Promise.all(
            hrefs.map(async (href) => {
              try {
                const img = new Image();
                img.src = href;
                await img.decode();
                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(img, 0, 0);
                const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let visible = 0;
                for (let i = 3; i < px.length; i += 4) if (px[i] > 0) visible++;
                return { ok: img.naturalWidth > 0 && visible > 0, detail: `${img.naturalWidth}px/${visible}px` };
              } catch (error) {
                return { ok: false, detail: `无法解码: ${error.name ?? error}` };
              }
            }),
          );
          check(
            "每张位图都真能解码、且带可见像素",
            hrefs.length > 0 && decoded.length === hrefs.length && decoded.every((d) => d.ok),
            `${decoded.length} 张: ${decoded.map((d) => d.detail).join(", ")}`,
          );

          // --- GitHub 重渲染仓库头部那一行 ---
          // The row is React's: when its partial commits it replaces the row and
          // everything inside it goes — including the button the content script
          // put there. A fresh clone of the row *is* that commit, down to the
          // identity of the Code button: the old row (with our host in it) leaves,
          // a new Code button arrives, and nothing dispatches `turbo:load`. This is
          // the shipped bug (2026-10-16, the 0.4s-then-gone button in the
          // recording): `turbo:load` was the only re-mount signal, so a re-render
          // left the row buttonless for good. The watcher is the only thing that
          // can bring it back — which is what the two checks below pin, one
          // asserting the loss actually happens, the other asserting the recovery.
          const liveRow = codeButton.parentElement;
          const clone = liveRow.cloneNode(true);
          clone.querySelectorAll("repoways-ui").forEach((el) => el.remove());
          liveRow.replaceWith(clone);
          check(
            "重渲染的一瞬按钮确实没了（复现线上那一幕）",
            document.querySelectorAll("repoways-ui").length === 0,
            `换行后剩 ${document.querySelectorAll("repoways-ui").length} 个 host`,
          );

          // The watcher's callback is a microtask, so any yield proves it ran.
          await new Promise((resolve) => setTimeout(resolve, 0));
          const revived = document.querySelector("repoways-ui");
          const freshCode = clone.querySelector(
            'button[data-component="Button"][data-variant="primary"][aria-haspopup="true"]',
          );
          check(
            "GitHub 重渲染后按钮自己回来了、仍插在 Code 按钮左边",
            document.querySelectorAll("repoways-ui").length === 1 &&
              revived?.parentElement === clone &&
              revived?.nextElementSibling === freshCode,
            `host=${document.querySelectorAll("repoways-ui").length} 父=${revived?.parentElement?.className} 右邻=${revived?.nextElementSibling?.textContent?.trim()}`,
          );

          render();
        }, 0);
      });
    </script>
  </body>
</html>
