name: Release

# Builds the store zips for a published release and attaches them to it, so the
# release page carries the exact artifact that was built from that tag. The
# release itself is created here as a draft — `release-it` only cuts the tag
# (`release: false`), so there is nothing to attach to until this workflow makes
# one; publishing stays a deliberate manual click.
#
# The tag is namespaced per extension (see apps/prelook/.release-it.json), so
# this only fires for Prelook's own version bumps — a tag for another app in the
# monorepo, or a repo-wide version, no longer starts this workflow.
#
# `workflow_dispatch` builds the same zips without cutting a release — the files
# then only land in the run's artifacts, which is what you want for a re-build or
# a test upload.
on:
  push:
    tags:
      - "prelook-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: "12"
          cache: true

      # A tag can be cut without CI having run on its commit; shipping a zip built
      # from a tree that no longer type-checks is the expensive failure.
      - name: Type check (vue-tsc)
        run: pnpm compile

      # Chrome/Edge zip + Firefox zip + the Firefox sources zip (WXT emits the
      # sources zip for Firefox only, which AMO review asks for).
      - name: Build zips
        run: |
          pnpm zip:prelook
          pnpm zip:prelook:firefox

      # Two traps live in this step. Every step runs with the repo root as its
      # working directory, so `path` is repo-root relative and must carry the
      # package prefix (wxt writes `.output` inside apps/prelook). And
      # upload-artifact excludes hidden files by default since v4.4 — `.output`
      # counts as hidden because it starts with a dot, which silently makes the
      # glob match nothing.
      - name: Upload the zips as run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prelook-zips
          path: apps/prelook/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error

      # Two things this step must not assume. `github.event.release` is empty on a
      # tag push (the payload is a push, not a release), so the tag has to come
      # from `github.ref_name` — reading it off `github.event.release.tag_name`
      # yields an empty string and `gh release upload "" ...` fails as "release
      # not found". And since `release-it` runs with `release: false`, the release
      # does not exist yet, so it gets created here as a draft. A manual run has
      # no tag to attach to and stops at the run artifacts.
      - name: Attach the zips to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.EXTENSIONS_RELEASE_TOKEN }}
          run: |
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              || gh release create "$TAG" --draft --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" apps/prelook/.output/*.zip --clobber --repo "$GITHUB_REPOSITORY"

      # - name: Submit to stores
