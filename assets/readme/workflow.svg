<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">机制：一次悬停预览</title>
  <desc id="wf-desc">悬停链接 → 后台预检 → 就地渲染（iframe 优先，禁嵌转阅读模式）→ 移开即关。</desc>

  <rect width="1200" height="340" rx="26" fill="#0e1116"/>

  <rect x="48" y="50" width="10" height="10" rx="2" fill="#7d6cff"/>
  <text x="68" y="61" font-size="15" letter-spacing="1.5" fill="#9aa4b4"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MECHANISM · 一次悬停预览</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- Card 1 -->
    <g>
      <rect x="48" y="112" width="248" height="210" rx="14" fill="#161b23" stroke="#2a3140" stroke-width="1.5"/>
      <rect x="68" y="132" width="40" height="40" rx="10" fill="#7d6cff" fill-opacity="0.12"/>
      <circle cx="87" cy="150" r="9" fill="none" stroke="#7d6cff" stroke-width="2.5"/>
      <line x1="94" y1="157" x2="99" y2="162" stroke="#7d6cff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="276" y="162" text-anchor="end" font-size="15" fill="#7d6cff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
      <text x="68" y="206" font-size="22" font-weight="600" fill="#eef1f7">悬停链接</text>
      <text x="68" y="236" font-size="18" fill="#9aa4b4">光标处出现倒计时进度条，</text>
      <text x="68" y="260" font-size="18" fill="#9aa4b4">到点就地开窗。</text>
    </g>

    <!-- Card 2 -->
    <g>
      <rect x="333" y="112" width="248" height="210" rx="14" fill="#161b23" stroke="#2a3140" stroke-width="1.5"/>
      <rect x="353" y="132" width="40" height="40" rx="10" fill="#7d6cff" fill-opacity="0.12"/>
      <rect x="365" y="140" width="16" height="24" rx="3" fill="none" stroke="#7d6cff" stroke-width="2.5"/>
      <path d="M 370 151 l 3 3 l 5 -6" fill="none" stroke="#7d6cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="561" y="162" text-anchor="end" font-size="15" fill="#7d6cff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
      <text x="353" y="206" font-size="22" font-weight="600" fill="#eef1f7">后台预检</text>
      <text x="353" y="236" font-size="18" fill="#9aa4b4">抓取 + canEmbed 判定，</text>
      <text x="353" y="260" font-size="18" fill="#9aa4b4">决定 iframe 或阅读模式。</text>
    </g>

    <!-- Card 3 -->
    <g>
      <rect x="618" y="112" width="248" height="210" rx="14" fill="#161b23" stroke="#2a3140" stroke-width="1.5"/>
      <rect x="638" y="132" width="40" height="40" rx="10" fill="#7d6cff" fill-opacity="0.12"/>
      <rect x="647" y="140" width="22" height="24" rx="4" fill="none" stroke="#7d6cff" stroke-width="2.5"/>
      <line x1="647" y1="146" x2="669" y2="146" stroke="#7d6cff" stroke-width="2.5"/>
      <circle cx="651" cy="143" r="1.6" fill="#7d6cff"/>
      <text x="846" y="162" text-anchor="end" font-size="15" fill="#7d6cff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
      <text x="638" y="206" font-size="22" font-weight="600" fill="#eef1f7">就地渲染</text>
      <text x="638" y="236" font-size="18" fill="#9aa4b4">iframe 优先；</text>
      <text x="638" y="260" font-size="18" fill="#9aa4b4">禁嵌站点自动切阅读模式。</text>
    </g>

    <!-- Card 4 -->
    <g>
      <rect x="903" y="112" width="248" height="210" rx="14" fill="#161b23" stroke="#2a3140" stroke-width="1.5"/>
      <rect x="923" y="132" width="40" height="40" rx="10" fill="#7d6cff" fill-opacity="0.12"/>
      <rect x="932" y="140" width="22" height="24" rx="4" fill="none" stroke="#9aa4b4" stroke-width="2.5"/>
      <path d="M 948 145 l 5 5 M 953 145 l -5 5" stroke="#7d6cff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1131" y="162" text-anchor="end" font-size="15" fill="#7d6cff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
      <text x="923" y="206" font-size="22" font-weight="600" fill="#eef1f7">移开即关</text>
      <text x="923" y="236" font-size="18" fill="#9aa4b4">400ms 宽限后自动关闭，</text>
      <text x="923" y="260" font-size="18" fill="#9aa4b4">可固定窗口。</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#5b6b82" stroke-width="2.5" fill="none">
    <path d="M 306 213 H 323"/>
    <path d="M 319 207 L 327 213 L 319 219"/>
    <path d="M 591 213 H 608"/>
    <path d="M 604 207 L 612 213 L 604 219"/>
    <path d="M 876 213 H 893"/>
    <path d="M 889 207 L 897 213 L 889 219"/>
  </g>
</svg>
