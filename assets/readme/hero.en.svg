<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Prelook — hover a link, preview in place</title>
  <desc id="hero-desc">Move the cursor over any link and a preview window floats up with the target page — no click, no going back. Chrome / Edge / Firefox.</desc>

  <rect width="1200" height="360" rx="26" fill="#0e1116"/>

  <!-- left: identity + value -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="64" y="52" width="10" height="10" rx="2" fill="#7d6cff"/>
    <text x="84" y="63" font-size="15" letter-spacing="1.5" fill="#9aa4b4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EXTENSIONS · PNPM MONOREPO</text>

    <text x="64" y="142" font-size="76" font-weight="700" fill="#eef1f7">Prelook</text>

    <text x="64" y="194" font-size="33" font-weight="600" fill="#eef1f7">Hover a link, preview in place</text>

    <text x="64" y="230" font-size="20" fill="#9aa4b4">Move over any link and a preview window</text>
    <text x="64" y="258" font-size="20" fill="#9aa4b4">floats up — no click, no going back.</text>

    <text x="64" y="298" font-size="16" fill="#6f7a8a"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Apache-2.0&#160;&#160;·&#160;&#160;MV3 / MV2&#160;&#160;·&#160;&#160;WXT 0.21 · Vue 3</text>
  </g>

