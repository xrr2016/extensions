main:
  push:
    - imports: https://cnb.cool/coldstoneboy/secrets/-/blob/main/secrets/envs.yml
    - stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/xrr2016/extensions.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
